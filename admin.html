<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IVAD · Panel de Administración</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />
<link rel="stylesheet" href="admin.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <nav class="navbar">
    <div class="nav-content">
      <div class="brand">
        <img src="https://rbtdahmhaksdvupsmkma.supabase.co/storage/v1/object/public/product-images/logo_transparent.png" alt="IVAD" class="nav-logo" style="height:52px; width:auto;" />
        <span>Panel de Recursos Humanos</span>
      </div>
      <button id="logoutBtn" class="btn-logout">Cerrar Sesión</button>
    </div>
  </nav>  <div class="tabs-container" style="max-width: 1200px; margin: 20px auto 0 auto; padding: 0 20px;">
    <button id="tabSolicitudes" class="tab-btn active">Solicitudes de Permiso</button>
    <button id="tabEmpleados" class="tab-btn">Control de Personal y Vacaciones</button>
  </div>

  <main class="dashboard">
    <!-- SECCIÓN: SOLICITUDES -->
    <div id="sectionSolicitudes" class="tab-section">
      <header class="dashboard-header">
        <h1>Registro de Solicitudes</h1>
        <div class="filters">
          <input type="text" id="searchInput" placeholder="Buscar por nombre o puesto..." />
        </div>
      </header>

      <div class="table-container">
        <table id="solicitudesTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Enviado el</th>
              <th>Colaborador</th>
              <th>Permiso (Fechas)</th>
              <th>Tipo y Horas</th>
              <th>Motivo</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="7" class="loading">Cargando datos...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- SECCIÓN: EMPLEADOS -->
    <div id="sectionEmpleados" class="tab-section" style="display: none;">
      <header class="dashboard-header">
        <h1>Control de Personal</h1>
        <button id="btnNuevoEmpleado" class="btn btn-primary" style="display: flex; align-items: center; gap: 8px;">
          ➕ Registrar Colaborador
        </button>
      </header>

      <div class="employee-grid" id="empleadosGrid">
        <!-- Renderizado dinámico de tarjetas -->
        <div class="loading" style="grid-column: 1 / -1;">Cargando colaboradores...</div>
      </div>
    </div>
  </main>

  <!-- MODAL: REGISTRAR/EDITAR EMPLEADO -->
  <div id="modalEmpleado" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalEmpleadoTitle">Registrar Nuevo Colaborador</h3>
        <button class="close-modal-btn" id="closeModalEmpleado">&times;</button>
      </div>
      <form id="formEmpleado">
        <input type="hidden" id="empId" />
        <div class="form-group">
          <label for="empNombre">Nombre completo</label>
          <input type="text" id="empNombre" placeholder="Ej. Juan Pérez" required />
        </div>
        <div class="form-group">
          <label for="empPuesto">Puesto / Cargo</label>
          <input type="text" id="empPuesto" placeholder="Ej. Encargado de Ventas" required />
        </div>
        <div class="form-group">
          <label for="empTelefono">Teléfono / Celular</label>
          <input type="tel" id="empTelefono" placeholder="Ej. 809-555-0199" />
        </div>
        <div class="form-group">
          <label for="empVacTotales">Días de Vacaciones Totales (Anual)</label>
          <input type="number" id="empVacTotales" value="14" min="0" required />
        </div>
        <div class="form-group">
          <label for="empVacDisponibles">Días Disponibles Actualmente</label>
          <input type="number" id="empVacDisponibles" value="14" min="0" required />
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btnCancelarEmpleado">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar Colaborador</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: ACTIVAR VACACIONES (TOMAR VACACIONES) -->
  <div id="modalVacaciones" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Activar Vacaciones</h3>
        <button class="close-modal-btn" id="closeModalVacaciones">&times;</button>
      </div>
      <form id="formVacaciones">
        <input type="hidden" id="vacEmpId" />
        <div class="form-group">
          <label>Colaborador</label>
          <input type="text" id="vacEmpNombre" readonly style="background:#f9f9f9; border-color:#eee; font-weight:600;" />
        </div>
        <div class="form-group">
          <label for="vacDesde">Desde (Fecha de Inicio)</label>
          <input type="date" id="vacDesde" required />
        </div>
        <div class="form-group">
          <label for="vacHasta">Hasta (Fecha de Regreso/Fin)</label>
          <input type="date" id="vacHasta" required />
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btnCancelarVacaciones">Cancelar</button>
          <button type="submit" class="btn btn-primary">Iniciar Vacaciones</button>
        </div>
      </form>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
